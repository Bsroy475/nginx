pipeline:
  id: pipeline_nginx_build_f91e
  name: pipeline_nginx_build_f91e
  stages:
    - name: Build
      id: build
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Install Dependencies
          id: install_dependencies
          run:
            shell: bash
            script: |-
              set -e
              sudo apt-get update -qq
              sudo apt-get install -y -qq build-essential libpcre3-dev zlib1g-dev libssl-dev
              cc --version
        - name: Configure and Build
          id: configure_and_build
          run:
            shell: bash
            script: |-
              set -e
              ./auto/configure
              make
  tags:
    onboarding: "true"
